name: APK bauen

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:   # manuell starten über den Tab "Actions"

permissions:
  contents: write      # nötig, um Releases anzulegen

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle einrichten (mit Cache)
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausführbar machen
        run: chmod +x gradlew

      - name: Tests ausführen
        run: ./gradlew testDebugUnitTest

      - name: Debug-APK bauen
        run: ./gradlew assembleDebug

      - name: Versionsname und APK-Dateiname bestimmen
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            NAME="CaddyLog ${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
            NAME="CaddyLog ${VERSION} (Build ${GITHUB_RUN_NUMBER})"
          fi
          APK="CaddyLog-${TAG}.apk"
          cp app/build/outputs/apk/debug/*.apk "$APK"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CaddyLog-${{ steps.ver.outputs.tag }}
          path: ${{ steps.ver.outputs.apk }}

      # Jeder Push auf main (und jeder v*-Tag) wird ein eigenes Release und als „Latest“ markiert.
      - name: Release anlegen
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.ver.outputs.name }}
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: ${{ steps.ver.outputs.apk }}
